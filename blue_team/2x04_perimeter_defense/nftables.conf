#!/usr/sbin/nft -f
# Generated from segmentation_rules.json by 4-nftables_config.sh.
# Denied packets are logged through the kernel logger and normally appear
# in /var/log/ufw.log or /var/log/syslog, depending on logger configuration.

flush ruleset

table inet meddefense {
    set dmz_zone {
        type ipv4_addr
        flags interval
        elements = { 10.10.20.0/24 }
    }

    set internal_zone {
        type ipv4_addr
        flags interval
        elements = { 10.10.30.0/24 }
    }

    set mgmt_zone {
        type ipv4_addr
        flags interval
        elements = { 10.10.40.0/24 }
    }

    set meddev_zone {
        type ipv4_addr
        flags interval
        elements = { 10.10.50.0/24 }
    }

    set trusted_zones {
        type ipv4_addr
        flags interval
        elements = { 10.10.20.0/24, 10.10.30.0/24, 10.10.40.0/24, 10.10.50.0/24 }
    }

    chain input {
        type filter hook input priority 0; policy drop;
        ct state established,related accept comment "md_rule_001"
        iifname "lo" accept comment "md_rule_002"
        ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } accept comment "md_rule_003"
        ip6 nexthdr ipv6-icmp icmpv6 type { echo-request, destination-unreachable, packet-too-big, time-exceeded, nd-neighbor-solicit, nd-neighbor-advert } accept comment "md_rule_004"
        ip saddr @mgmt_zone tcp dport 22 accept comment "md_rule_005 | SSH administration of internal servers"
        ip saddr @internal_zone tcp dport 443 accept comment "md_rule_006 | Clinical workstation access to internal HTTPS applications"
        ip saddr @internal_zone tcp dport 3306 accept comment "md_rule_007 | Clinical application access to internal MySQL services"
        ip saddr { 10.10.20.10, 10.10.20.11 } tcp dport 3306 accept comment "md_rule_008 | Named DMZ application hosts access internal databases"
        ip saddr @meddev_zone tcp dport 4242 accept comment "md_rule_009 | DICOM imaging to PACS"
        ip saddr @meddev_zone tcp dport 443 accept comment "md_rule_010 | EHR web integration for device display"
        log prefix "MEDDEFENSE_INPUT_DROP " flags all counter drop comment "md_rule_011"
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
        ct state established,related accept comment "md_rule_012"
        ip saddr @mgmt_zone ip daddr @internal_zone tcp dport 22 accept comment "md_rule_013 | SSH administration of internal servers"
        ip saddr @mgmt_zone ip daddr @dmz_zone tcp dport 22 accept comment "md_rule_014 | SSH administration of DMZ servers"
        ip saddr { 10.10.20.10, 10.10.20.11 } ip daddr @internal_zone tcp dport 3306 accept comment "md_rule_015 | Named DMZ application hosts access internal databases"
        ip saddr @meddev_zone ip daddr @internal_zone tcp dport 4242 accept comment "md_rule_016 | DICOM imaging to PACS"
        ip saddr @meddev_zone ip daddr @internal_zone tcp dport 443 accept comment "md_rule_017 | EHR web integration for device display"
        ip daddr { 10.10.40.53 } udp dport 53 accept comment "md_rule_018 | DNS resolution through the management resolver"
        ip daddr { 10.10.40.53 } tcp dport 53 accept comment "md_rule_019 | DNS TCP fallback through the management resolver"
        ip saddr @mgmt_zone ip daddr @meddev_zone tcp dport 22 accept comment "md_rule_020 | SSH administration of supported medical devices"
        ip saddr @mgmt_zone ip daddr @meddev_zone tcp dport 4242 accept comment "md_rule_021 | DICOM service validation and medical-device management"
        log prefix "MEDDEFENSE_FORWARD_DROP " flags all counter drop comment "md_rule_022"
    }

    chain output {
        type filter hook output priority 0; policy accept;
        ip saddr @internal_zone ip daddr @internal_zone tcp dport 443 accept comment "md_rule_023 | Clinical workstation access to internal HTTPS applications"
        ip saddr @internal_zone ip daddr @internal_zone tcp dport 3306 accept comment "md_rule_024 | Clinical application access to internal MySQL services"
        ip daddr { 10.10.40.53 } udp dport 53 accept comment "md_rule_025 | DNS resolution through the management resolver"
        ip daddr { 10.10.40.53 } tcp dport 53 accept comment "md_rule_026 | DNS TCP fallback through the management resolver"
        ip daddr @dmz_zone log prefix "MEDDEFENSE_OUTPUT_DROP " flags all counter drop comment "md_rule_027"
        ip daddr @mgmt_zone log prefix "MEDDEFENSE_OUTPUT_DROP " flags all counter drop comment "md_rule_028"
        ip daddr @meddev_zone log prefix "MEDDEFENSE_OUTPUT_DROP " flags all counter drop comment "md_rule_029"
        ip daddr @internal_zone log prefix "MEDDEFENSE_OUTPUT_DROP " flags all counter drop comment "md_rule_030"
    }
}
