# meddefense-upstream.conf
# SHIPPED WITH THE PROJECT -- not generated or modified by 13-dns_filtering.sh.
#
# In the real MedDefense lab this points at the internal recursive DNS
# server, which resolves *.meddefense.local internally and forwards
# everything else upstream. This sandbox copy is a stand-in fixture used
# only to validate the filtering script end-to-end: it forwards to a
# public resolver and adds one local A record so an "allowed internal
# domain" validation case has something real to resolve.
no-resolv
server=8.8.8.8
server=1.1.1.1
address=/billing.meddefense.local/10.10.1.10
