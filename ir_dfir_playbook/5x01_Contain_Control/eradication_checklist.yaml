- id: ERAD-013
  category: krbtgt
  target_host: AD domain
  description: Assess whether a coordinated krbtgt double reset is warranted; do not assume key theft from Pass-the-Ticket
    alone.
  command_or_action: 'IR Commander + AD forest owners: investigate DC compromise, Golden Ticket/krbtgt key exposure
    and forged TGT evidence. If confirmed, follow Microsoft-supported krbtgt double-reset procedure, allow full
    replication and sufficient interval between resets; do not run ad hoc commands.'
  verification_command: 'AD team: verify domain-controller replication (repadmin /replsummary), krbtgt pwdLastSet
    after each authorized reset, Kerberos authentication health and absence of forged/pre-reset tickets in monitored
    auth logs'
  expected_verification_result: 'If indicated and approved: two reset cycles completed with replication and appropriate
    interval; domain auth healthy; legacy forged TGTs rejected. Otherwise: written decision that reset is not indicated.'
  status: pending
  executed_at: null
  executed_by: null
  rationale: auth_expansion_0334Z.log suggests ticket misuse/lateral movement, not confirmed krbtgt secret compromise.
    Double reset is high-impact and requires domain-wide change management; evaluate, do not automatically execute.
- id: ERAD-014
  category: network
  target_host: perimeter / internal segmentation
  description: Retain egress deny for both observed C2 destinations 185.220.101.47 and 91.234.99.107 and block lateral
    access from affected endpoints until cleared.
  command_or_action: 'Firewall console: deny/log outbound destination 185.220.101.47:443 and 91.234.99.107:443 for
    scoped assets; apply quarantine ACL blocking production lateral paths while permitting approved IR jumpbox;
    save change IDs'
  verification_command: Firewall rule audit + SIEM/NetFlow query for both IPs after enforcement; verify deny logs
    and no successful established sessions; test quarantine reachability from jumpbox and user VLAN
  expected_verification_result: Both IPs blocked; no successful C2 connections after enforcement within validated
    collection coverage (denied attempts may still generate packets); production lateral paths blocked; IR jumpbox
    allowed.
  status: pending
  executed_at: null
  executed_by: null
- id: ERAD-015
  category: network
  target_host: WST-WS-031 / WST-WS-017 / LIS-WSIDE-01
  description: Validate host firewall and EDR containment policies across all three hosts; retain isolation until
    recovery criteria met.
  command_or_action: 'EDR console: confirm containment policy enabled for each host where supported; firewall console:
    review effective ACLs; do not release host before recovery approval'
  verification_command: EDR device status + firewall effective policy export + connectivity tests from IR jumpbox
    and production segment
  expected_verification_result: Containment status and network segmentation confirmed for each scoped host; deviations
    logged and approved.
  status: pending
  executed_at: null
  executed_by: null
