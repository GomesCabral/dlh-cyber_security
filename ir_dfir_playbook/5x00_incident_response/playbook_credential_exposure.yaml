playbook_id: "PB-CRED-001"
title: "Confirmed Credential Exposure - Microsoft Phishing and Foreign Sign-in"
owner_role: IR_Commander

applies_to:
  triggers:
    - "User reports entering MedDefense credentials into a fake Microsoft login page; a foreign-IP sign-in follows within one hour."
    - "Splunk correlation of Azure AD sign-in activity with a reported phishing URL and unusual source IP."
  indicators:
    - "Successful Azure AD sign-in from an unfamiliar foreign IP, device, or location."
    - "Unrecognized MFA prompt, newly registered authentication method, or unusual VPN authentication."
    - "Unexpected mailbox rules, message access, Epic access, or bulk patient-record queries."

severity_mapping:
  initial: SEV2
  escalate_if:
    - "SEV1: confirmed_broad ePHI exposure or high patient-safety impact."
    - "SEV1: full_outage of critical clinical services or confirmed compromise spreading across sites."
    - "Reassess SEV2 immediately if additional accounts or privileged access are found; notify Executive_Sponsor of scope expansion."

immediate_actions:
  - step: "Minute 0-2: open SEV2 incident in the case system; record UTC discovery time, affected account, reported phishing URL, suspicious IP, and reporter; notify IR_Commander, Technical_Lead, and Scribe using the SEV2 on_detection path."
    owner: Scribe
    timebox_minutes: 2
  - step: "Minute 2-5: verify successful foreign-IP authentication in Splunk/Azure AD, establish earliest possible exposure time and current session status; use trusted contact details to warn the user not to approve MFA prompts or use the compromised account."
    owner: Technical_Lead
    timebox_minutes: 3
  - step: "Minute 5-8: direct parallel read-only exports of authentication, Azure AD sign-in, mailbox, and recent data-access evidence; record source, UTC range, export operator, hash, and restricted evidence location."
    owner: Technical_Lead
    timebox_minutes: 3
  - step: "By minute 10: IR_Commander records the decision to revoke access immediately (default), or authorizes at most two minutes of read-only observation only if there is no active access to ePHI, privileged resources, or ongoing harmful activity; stop observation immediately on any new activity."
    owner: IR_Commander
    timebox_minutes: 2
  - step: "By minute 15: execute approved account/session containment, confirm revocation attempts, and escalate any failed control or clinical-service disruption."
    owner: Technical_Lead
    timebox_minutes: 5

evidence_preservation:
  - artifact: "On-prem Active Directory and VPN authentication logs for the affected identity and source IPs, covering at least 24 hours before the reported phish through containment."
    method: "Export original timestamped records read-only from DC/VPN log sources or Splunk; preserve raw format, UTC offsets, query, SHA-256 hash, and chain-of-custody record."
    before_step: "Active Directory password reset and VPN token revocation"
  - artifact: "Azure AD sign-in and audit log export, including session, device, IP, location, MFA and authentication-method changes."
    method: "Export raw sign-in/audit results for the same window through authorized Azure AD administration; hash the export and log the query and operator."
    before_step: "Azure AD session revocation and MFA device reset"
  - artifact: "Affected Microsoft 365 mailbox export, including relevant phishing message, headers, mailbox rules, forwarding configuration and access/audit history."
    method: "Use an authorized compliance/eDiscovery export with least-privilege access; preserve original message metadata, audit records, hash, and chain of custody."
    before_step: "Azure AD session revocation and Active Directory password reset"
  - artifact: "Recent data-access audit export for Epic, LIS and other ePHI-capable systems reachable by the account during the exposure window."
    method: "Export account-scoped read-only access logs with patient-record identifiers, action, UTC timestamp and source; restrict access because evidence may itself contain ePHI."
    before_step: "Epic session termination and Active Directory password reset"

containment_actions:
  - step: "Preserve the four evidence exports above first when safely possible; if harmful activity is ongoing, preserve available read-only snapshots immediately and contain without waiting for a full mailbox export."
    owner: IR_Commander
    decision_point: "Record evidence completeness and patient-safety risk; never delay urgent containment solely for a lengthy export."
    trade_off: "Preserves forensic visibility where feasible but prioritizes stopping further unauthorized access."
  - step: "Reset the affected on-prem Active Directory password to a unique random value; require a verified identity check and secure new-credential delivery."
    owner: Technical_Lead
    decision_point: "After initial evidence capture or immediate IR_Commander emergency authorization; verify hybrid identity synchronization."
    trade_off: "Blocks reuse of stolen credentials but temporarily interrupts legitimate workstation and application access."
  - step: "Revoke all active Azure AD (Microsoft Entra ID) refresh sessions/sign-in sessions for the affected account and block sign-in temporarily until clean re-enrollment is verified."
    owner: Technical_Lead
    decision_point: "Perform immediately after evidence snapshot; record that already-issued access tokens may remain valid until expiration or enforcement."
    trade_off: "Disrupts attacker cloud access but signs out the legitimate user and may not invalidate every token instantly."
  - step: "Remove untrusted MFA authentication methods and reset/re-register the user's approved Azure MFA device after independent identity verification."
    owner: Technical_Lead
    decision_point: "Check audit logs for attacker-added methods first; require supervised re-enrollment and do not approve push prompts during the incident."
    trade_off: "Prevents attacker MFA persistence but interrupts legitimate MFA-protected workflows."
  - step: "Revoke VPN tokens/sessions for the account and block new VPN authentication until revalidation."
    owner: Technical_Lead
    decision_point: "Coordinate with Network Engineer and verify session termination in VPN logs."
    trade_off: "Cuts off remote network access but also disconnects the legitimate remote user."
  - step: "Terminate active Epic sessions for the affected identity using authorized Epic administration; disable further Epic login pending review."
    owner: Technical_Lead
    decision_point: "Coordinate with clinical IT and care-team supervisor to transfer any active patient-care workflow safely before termination, unless immediate harm requires urgent disconnection."
    trade_off: "Stops possible patient-record access but can interrupt clinical documentation and care workflows."

eradication_actions:
  - "Remove malicious mailbox forwarding/inbox rules, attacker-added MFA methods and unauthorized OAuth/app consents found in the investigation; preserve evidence before deletion."
  - "Inspect affected endpoints with Wazuh EDR or Microsoft Defender for Endpoint as appropriate; isolate/remediate any malware and verify the phishing URL is blocked."
  - "Investigate other accounts contacted by the phishing campaign and rotate any additional credentials or service secrets confirmed exposed."

recovery_validation:
  - check: "Validate identity restoration and cloud access using a clean, managed device."
    criterion: "AD password reset synchronized; only verified MFA methods registered; legitimate user signs in successfully; no unauthorized active Azure AD/VPN sessions or suspicious sign-ins in the next 24 hours."
  - check: "Validate Epic and clinical access with clinical IT."
    criterion: "Authorized Epic session works after re-enablement, unauthorized sessions are terminated, and clinical workflow owner confirms no unsafe disruption."
  - check: "Validate exposure scope and mailbox configuration."
    criterion: "No malicious rules/forwarding or unauthorized app consents remain; suspicious mailbox and ePHI accesses are reviewed and recorded with evidence references."

communication_plan:
  - audience: "IR_Commander and Technical_Lead"
    trigger: "SEV2 declaration and each material status change"
    template: "incident_internal_status_template.md"
  - audience: "Executive_Sponsor"
    trigger: "SEV1 escalation, clinical risk, or scope expansion beyond initial account"
    template: "executive_incident_brief_template.md"
  - audience: "Legal_Liaison"
    trigger: "Compromise confirmation or evidence that ePHI was accessible during the exposure window; request HIPAA assessment of access, acquisition, disclosure, and notification duties"
    template: "legal_hipaa_assessment_template.md"
  - audience: "Communications_Lead"
    trigger: "Confirmed compromise requiring coordinated staff or external messaging; release only legally approved statements"
    template: "incident_communications_template.md"

escalation_triggers:
  - "Immediately notify Legal_Liaison and perform HIPAA assessment: was ePHI accessible from the compromised account between credential submission and confirmed containment, and do audits show access or acquisition?"
  - "Raise to SEV1 immediately for confirmed broad ePHI exposure, high patient-safety impact, or full outage of critical clinical services; Executive_Sponsor owns SEV1 decisions."
  - "Notify Executive_Sponsor and reassess severity if additional identities, privileged roles, Epic/LIS systems or hospital sites are implicated."
  - "Escalate SEV2 for IR Commander review if no documented containment progress within 60 minutes; if already SEV1, activate executive crisis support after 15 minutes without progress."
  - "Escalate immediately if Azure AD, VPN, or Epic session termination cannot be verified or suspicious access continues."

post_incident_tasks:
  - "Produce an evidence-linked UTC timeline of phishing submission, foreign-IP sign-in, MFA events, data access, containment, and restored access."
  - "Document Legal Liaison's HIPAA/state-law assessment and notification decision; do not assume a breach or exfiltration without analysis."
  - "Review detection gaps for impossible travel, unfamiliar sign-ins, MFA changes, suspicious inbox rules, and Epic ePHI access; assign rule owners and due dates."
  - "Review decision to contain versus observe, evidence collection latency, patient-care impact, and playbook updates at the post-incident meeting."
