# MedDefense — IR-2026-0420-01 — ERADICATION PLAN (not execution evidence)
incident_id: IR-2026-0420-01
document: Eradication checklist — execution NOT yet evidenced
evidence_boundary: Only schema samples and preliminary forensic report available. No production action or verification
  has been performed. All items pending.
execution_gate: Preserve forensic artifacts and hashes, approve change window, clinical sign-off, maintain isolation
  until all validation checks pass.
status_values:
- pending
- in_progress
- blocked
- verified_complete
verification_policy: Set verified_complete only after attaching timestamped actual verification output; update executed_at
  and executed_by; preserve original log.
